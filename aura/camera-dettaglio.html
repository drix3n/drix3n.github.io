<!-- camera-dettaglio.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Camera - Aura Suites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-neutral-800 antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-cream/90 backdrop-blur-md border-b border-neutral-soft">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="font-serif-title text-2xl tracking-widest uppercase font-semibold text-neutral-900">AURA</a>
            <nav class="hidden md:flex items-center space-x-6 text-sm tracking-wide font-medium text-neutral-600">
                <a href="index.html#camere" class="hover:text-neutral-900 transition">Camere</a>
                <a href="wellness.html" class="hover:text-neutral-900 transition">Wellness & Spa</a>
                <a href="ristorazione.html" class="hover:text-neutral-900 transition">Ristoranti & Bar</a>
                <a href="prenotazione.html" class="hover:text-neutral-900 transition">Prenota</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 py-8 w-full space-y-8">
        <!-- Banner Dettaglio -->
        <div class="border-b border-neutral-soft pb-4 flex justify-between items-end">
            <div>
                <span id="room-max-guests-badge" class="text-xs uppercase tracking-wider text-neutral-400 font-semibold block mb-1">Max Ospiti</span>
                <h1 id="room-title" class="font-serif-title text-4xl font-light text-neutral-900">Caricamento Camera...</h1>
            </div>
            <div id="room-availability-badge" class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold">
                Disponibilità
            </div>
        </div>

        <!-- Galleria Foto -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <img id="img-1" class="h-80 w-full object-cover rounded-2xl md:col-span-2 shadow-sm" src="" alt="Foto Principale">
            <div class="grid grid-cols-1 gap-4">
                <img id="img-2" class="h-38 w-full object-cover rounded-2xl shadow-sm" src="" alt="Interno">
                <img id="img-3" class="h-38 w-full object-cover rounded-2xl shadow-sm" src="" alt="Bagno/Vista">
            </div>
        </div>

        <!-- Informazioni Dettagliate -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-neutral-soft space-y-4">
                    <h2 class="font-serif-title text-2xl text-neutral-900">Descrizione dell'Alloggio</h2>
                    <p id="room-description" class="text-sm text-neutral-600 leading-relaxed"></p>
                    <div id="room-features" class="grid grid-cols-2 md:grid-cols-3 gap-4 pt-4 border-t border-neutral-soft text-xs text-neutral-500"></div>
                </div>
            </div>

            <div class="md:col-span-1">
                <div class="bg-white p-6 rounded-2xl border border-neutral-soft shadow-sm sticky top-24 space-y-6">
                    <div>
                        <span class="text-xs text-neutral-400 block">Prezzo di partenza</span>
                        <span id="room-price" class="text-3xl font-semibold text-neutral-900">€0</span>
                        <span class="text-xs text-neutral-400"> / notte</span>
                    </div>
                    <a id="select-btn" href="#" class="block text-center w-full py-4 bg-stone-dark text-white rounded-xl text-xs uppercase tracking-widest font-semibold hover:bg-neutral-800 transition">
                        Seleziona Questa Camera
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadRoomDetails);
    </script>
</body>
</html>
