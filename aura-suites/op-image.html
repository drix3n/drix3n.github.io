<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>OG Image - Aura Suites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .og-canvas {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #1C1917;
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }

    /* === SFONDO === */
    .og-bg {
        position: absolute;
        inset: 0;
        background-image: url('img/Aura-Suites-1.jpg');
        background-size: cover;
        background-position: center 40%;
        filter: brightness(0.85) saturate(1.05);
    }

    /* Vignettatura + gradiente dal basso per far leggere il testo */
    .og-overlay {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.35) 100%),
            linear-gradient(to top,
                rgba(15, 13, 12, 0.95) 0%,
                rgba(15, 13, 12, 0.75) 25%,
                rgba(15, 13, 12, 0.35) 50%,
                rgba(15, 13, 12, 0.05) 75%,
                transparent 100%);
    }

    /* Grana sottile per look premium */
    .og-grain {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        pointer-events: none;
    }

    /* === CONTENUTO === */
    .og-content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        padding: 56px 64px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff;
    }

    /* Header: logo sx + badge dx */
    .og-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .og-logo {
        font-family: 'Cormorant Garamond', serif;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: 14px;
        color: #fff;
        text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        line-height: 1;
        padding-left: 2px;
    }

    .og-logo::after {
        content: '';
        display: block;
        width: 44px;
        height: 1px;
        background: linear-gradient(to right, #D4B895, transparent);
        margin-top: 10px;
        margin-left: 2px;
    }

    .og-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px 10px 16px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 100px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
    }

    .og-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #D4B895;
        box-shadow: 0 0 10px rgba(212, 184, 149, 0.8);
    }

    /* Footer: titolo + sottotitolo + tag */
    .og-footer {
        max-width: 900px;
    }

    .og-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 108px;
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -2px;
        color: #fff;
        margin-bottom: 22px;
        text-shadow: 0 4px 40px rgba(0,0,0,0.4);
    }

    .og-title em {
        font-style: italic;
        font-weight: 400;
        color: #E8D9C0;
    }

    .og-subtitle {
        font-size: 22px;
        font-weight: 300;
        color: rgba(255,255,255,0.92);
        letter-spacing: 0.3px;
        margin-bottom: 26px;
    }

    .og-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
    }

    .og-divider-line {
        width: 48px;
        height: 1px;
        background: #D4B895;
    }

    .og-divider-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #D4B895;
    }

    .og-tagline {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 4.5px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
    }

    /* Accento angolo in alto a destra */
    .og-corner {
        position: absolute;
        top: 0;
        right: 0;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle at top right, rgba(212, 184, 149, 0.12), transparent 70%);
        pointer-events: none;
    }
</style>
</head>
<body>

<div class="og-canvas">
    <div class="og-bg"></div>
    <div class="og-overlay"></div>
    <div class="og-corner"></div>
    <div class="og-grain"></div>

    <div class="og-content">

        <!-- Header -->
        <div class="og-header">
            <div class="og-logo">AURA</div>
            <div class="og-badge">
                <span class="og-badge-dot"></span>
                Adults Only 16+
            </div>
        </div>

        <!-- Footer -->
        <div class="og-footer">
            <h1 class="og-title">A quieter<br>kind of <em>luxury.</em></h1>
            <p class="og-subtitle">Boutique Hotel Adults Only — Taormina, Sicilia</p>

            <div class="og-divider">
                <div class="og-divider-line"></div>
                <div class="og-divider-dot"></div>
            </div>

            <p class="og-tagline">Suite Esclusive · Spa · Ristorazione · Escursioni</p>
        </div>

    </div>
</div>

</body>
</html>
